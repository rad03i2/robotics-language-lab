name: Robotics example request
description: Suggest a focused robotics example or lab improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: dropdown
    id: area
    attributes:
      label: Robotics area
      options:
        - Control
        - Navigation / planning
        - Sensors
        - Embedded / hardware
        - ROS 2 / robot description
        - Telemetry / dashboard
        - Diagnostics
        - Tooling
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: learning_goal
    attributes:
      label: Learning goal
      description: What robotics concept should the example demonstrate?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed example
      description: Keep it small, inspectable and runnable.
    validations:
      required: true
  - type: textarea
    id: assumptions
    attributes:
      label: Toolchain or hardware assumptions
